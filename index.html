<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade - Seletor CSS</title>
  <style>
    /* Seleciona apenas o primeiro <p> que é filho direto de .container */
    .container > p {
      color: #0ff;
      font-family:'Arial' sans-serif;
      font-size: 50px;
    font-style: italic;
    font-weight: bold;
    text-align: center;
    text-decoration: underline;
    text-transform: lowercase;
    letter-spacing: 2px;
    line-height: 1.5;
  </style>
</head>
<body>

  <div class="container">
    <p>Neymar é lindo</p>
    <div>
      <p>Meu cabelo é bonito</p>
    </div>
  </div>

</body>
</html>
